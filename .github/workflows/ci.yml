name: BSMS Full-Stack CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Lint, Test, & Build Verification
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/barber_shop_db?schema=public
      JWT_SECRET: test_super_secret_jwt_key_32_characters_long_1234

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 1. Frontend Checks
      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

      # 2. Backend Checks
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Validate Prisma Schema
        working-directory: ./backend
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Compile Backend TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Run Backend Test Suite
        working-directory: ./backend
        run: npm test
